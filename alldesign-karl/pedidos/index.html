<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F1EBE1" />
    <link rel="icon" href="/alldesign-karl/favicon-32.png" sizes="32x32" type="image/png" />
    <title>Pedidos — Alldesign Karl</title>
  </head>
  <body>
    <main class="adm">
      <header class="adm-top">
        <img src="/alldesign-karl/logo-256.webp" alt="" width="56" height="56" />
        <div><p class="k">Alldesign Karl · Panel privado</p><h1>Pedidos y altas</h1></div>
        <button type="button" class="ghost" id="logout" hidden>Salir</button>
      </header>

      <form class="login" id="login">
        <label for="key">Contraseña del panel</label>
        <input id="key" type="password" autocomplete="current-password" required />
        <button type="submit">Entrar</button>
        <p class="msg" id="login-msg" role="status"></p>
      </form>

      <section id="panel" hidden>
        <nav class="tabs" id="tabs">
          <button type="button" data-k="pedidos" aria-pressed="true">Pedidos <span></span></button>
          <button type="button" data-k="altas" aria-pressed="false">Altas de mayoristas <span></span></button>
          <button type="button" data-k="presupuestos" aria-pressed="false">Presupuestos <span></span></button>
          <button type="button" class="ghost" id="reload">Actualizar</button>
        </nav>
        <div id="list"></div>
      </section>
    </main>
    <script type="module" src="/src/alldesign/admin.ts"></script>
  </body>
</html>
